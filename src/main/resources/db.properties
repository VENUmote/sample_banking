# ---------------------------------------------------------------
# JDBC configuration (server-side only - never sent to the browser).
# This file is packaged into WEB-INF/classes, which Tomcat never serves.
#
# Each value can be overridden with an environment variable:
#   DB_URL, DB_USER, DB_PASSWORD
# ---------------------------------------------------------------
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/netbanking_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
db.user=root
db.password=YOUR_MYSQL_PASSWORD
