<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History | Net Banking</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="transactions">
<header id="app-nav" class="navbar"></header>
<div class="layout">
    <aside id="app-sidebar" class="sidebar"></aside>

    <main class="content">
        <div class="page-header">
            <div>
                <h1>Transaction History</h1>
                <p class="muted">All credits and debits on your account</p>
            </div>
        </div>

        <!-- Filters -->
        <section class="panel">
            <form id="filterForm" class="filter-bar" novalidate>
                <div class="form-group">
                    <label for="q">Search</label>
                    <input type="search" id="q" name="q" placeholder="Description or Txn ID" maxlength="100">
                </div>
                <div class="form-group">
                    <label for="type">Type</label>
                    <select id="type" name="type">
                        <option value="ALL">All</option>
                        <option value="CREDIT">CREDIT</option>
                        <option value="DEBIT">DEBIT</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="from">From Date</label>
                    <input type="date" id="from" name="from">
                </div>
                <div class="form-group">
                    <label for="to">To Date</label>
                    <input type="date" id="to" name="to">
                </div>
                <div class="form-group">
                    <label for="sort">Sort</label>
                    <select id="sort" name="sort">
                        <option value="desc">Latest first</option>
                        <option value="asc">Oldest first</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button type="submit" class="btn btn-primary">Apply</button>
                    <button type="reset" class="btn btn-outline" id="resetFilters">Reset</button>
                </div>
            </form>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h2>Transactions</h2>
                <span class="muted" id="resultInfo"></span>
            </div>
            <div class="filter-summary" id="filterSummary">
                <span>Credits shown: <strong id="sumCredit">&#8377;0.00</strong></span>
                <span>Debits shown: <strong id="sumDebit">&#8377;0.00</strong></span>
            </div>
            <div class="table-wrap">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>Txn ID</th>
                        <th>Date &amp; Time</th>
                        <th>Type</th>
                        <th>Description</th>
                        <th class="num">Credit Amount</th>
                        <th class="num">Debit Amount</th>
                        <th class="num">Balance After</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody id="historyBody">
                    <tr><td colspan="8" class="empty">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script src="js/common.js"></script>
<script src="js/history.js"></script>
</body>
</html>
