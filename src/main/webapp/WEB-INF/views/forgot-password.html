<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Net Banking</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body" data-page="forgot">
<main class="auth-wrapper">
    <section class="auth-hero">
        <div class="brand-logo">NB</div>
        <h2>Reset your password</h2>
        <p>Confirm your identity with your username, registered email and registered mobile number, then choose a new password.</p>
    </section>

    <section class="auth-card">
        <h1>Forgot Password</h1>
        <p class="muted">All details must match your registration</p>

        <form id="forgotForm" novalidate>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" maxlength="30" required>
                <small class="field-error" data-error-for="username"></small>
            </div>
            <div class="form-group">
                <label for="email">Registered Email</label>
                <input type="email" id="email" name="email" maxlength="150" required>
                <small class="field-error" data-error-for="email"></small>
            </div>
            <div class="form-group">
                <label for="mobile">Registered Mobile Number</label>
                <input type="tel" id="mobile" name="mobile" maxlength="10" inputmode="numeric" required>
                <small class="field-error" data-error-for="mobile"></small>
            </div>
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <div class="password-wrap">
                    <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" maxlength="64" required>
                    <button type="button" class="toggle-password" data-target="newPassword" aria-label="Show password">Show</button>
                </div>
                <small class="field-error" data-error-for="newPassword"></small>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" maxlength="64" required>
                <small class="field-error" data-error-for="confirmPassword"></small>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
        </form>

        <p class="auth-switch"><a href="login" class="link">&larr; Back to Sign In</a></p>
    </section>
</main>

<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
